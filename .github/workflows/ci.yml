name: CI
on:
  pull_request: {}
  push:
    branches: [main]
  # Gatilho manual (aba Actions → CI → "Run workflow"). Entrou depois da queda
  # de 2026-08-06, em que o GitHub descartou ~85% dos webhooks: dois pushes não
  # geraram run nenhum, e o próprio GitHub avisou que esses eventos "cannot be
  # automatically replayed". Sem `workflow_dispatch` a única saída era empurrar
  # commit vazio ou fechar/reabrir a PR — mexer no histórico pra contornar um
  # problema que não é do código.
  #
  # Só fica disponível depois de estar na branch padrão (é como o GitHub
  # funciona), então ele não salva a rodada de HOJE — salva a próxima.
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v7 nas duas: a v4 roda em Node 20, que o runner já força pra Node 24 e
      # avisa como obsoleto. Todas as majors de v5 pra cima declaram `node24`,
      # então v5 já calaria o aviso — v7 é pra não voltar a ficar duas majors
      # atrás e receber o mesmo recado daqui a pouco.
      #
      # A única mudança quebrante documentada é a do checkout v7: ele recusa
      # fazer checkout de PR de fork em `pull_request_target` e `workflow_run`.
      # Não nos alcança — este workflow dispara em `pull_request` e em `push`
      # na main, e nenhum dos dois está na lista.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # O CI roda no PISO do projeto, que é o que pega uso acidental de API mais
      # nova — e pegou: uma seção de teste usou o `WebSocket` global (Node 22+)
      # e o CI reprovou no antigo piso 20.
      #
      # O piso subiu para 22 (ver `engines` no package.json). O que ele compra,
      # e é o motivo da mudança: `WebSocket` cliente nativo, que apagou ~90
      # linhas de RFC 6455 escritas à mão só para atender um piso que ninguém
      # mais roda. Também `Promise.withResolvers` e `Array.findLast`.
      #
      # Manter isto igual ao `engines` é obrigatório — `test/node22.test.mjs`
      # cobra a coerência entre package.json, este arquivo e a documentação.
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Sintaxe (node --check)
        run: for f in js/*.js server/*.mjs worker/*.mjs; do node --check "$f"; done
      - name: Testes (node --test)
        run: |
          if [ -d test ]; then
            node --test
          else
            echo "Sem diretório test/ ainda — pulando testes."
          fi
      - name: CSS está em dia (npm run css)
        run: |
          # O css/app.css é GERADO (tools/gerar-css.mjs) e COMMITADO — projeto sem
          # build obrigatório. Ele junta o Tailwind e o css/styles.css, os dois
          # minificados. Se alguém mexe em classe no HTML/JS, ou edita o
          # styles.css, e esquece de regenerar, o estilo some silenciosamente em
          # produção. Aqui regeneramos e comparamos.
          #
          # O styles.css entrou nesta conta junto com a minificação: antes ele ia
          # cru pro browser e editar era suficiente. Agora não é — e é justamente
          # por isso que o guard precisa cobri-lo.
          cp css/app.css /tmp/app.committed.css
          npm run css
          if ! diff -q /tmp/app.committed.css css/app.css >/dev/null; then
            echo "::error::css/app.css está desatualizado. Rode 'npm run css' e commite o resultado."
            diff /tmp/app.committed.css css/app.css | head -40
            exit 1
          fi

      - name: Smoke de browser (o que guard de texto não pega)
        # Renderiza o card em 3 aparelhos × 3 idiomas × 3 tipos e MEDE. Os guards
        # de test/layout.test.mjs conferem o código e já falharam duas vezes em
        # silêncio; este pega rolagem dupla, alvo de toque encolhido, estouro
        # horizontal e português vazando fora do pt.
        #
        # O --no-save mantém o package.json com ZERO dependência, que é valor
        # do projeto. O postinstall do playwright baixaria chromium+firefox+
        # webkit (~400MB), então ele é pulado e só o chromium vem depois (~100MB).
        #
        # Tentei antes usar o Chrome que o runner já traz (channel: 'chrome') pra
        # economizar o download — mas isso depende do caminho onde a imagem do
        # runner instala o Chrome, que não é contrato. Baixar o chromium do
        # próprio Playwright custa ~30s e não depende de nada.
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-save playwright@1.49.1
          npx playwright install chromium
          npm run test:browser
          # Smoke de FLUXO: a app como máquina de estados. O de cima mede TELAS
          # (960 renders) e passou verde nos dois defeitos que o owner relatou
          # em 2026-08-23 — os dois só existem quando dois estados coexistem e
          # a app se redesenha. Cobertura de tela não é cobertura de fluxo.
          npm run test:fluxo
          # Dois navegadores, uma sala, uma conversa de verdade. É o único teste
          # que exercita o WebRTC — e WebRTC não tem versão sem browser. Reusa o
          # chromium já instalado no passo acima.
          npm run test:presenca

      - name: Boot smoke do adaptador Node
        run: |
          PORT=8099 node server/node.mjs & SRV=$!
          sleep 1.5
          # Grava e DEPOIS procura, em vez de `curl | grep -q`.
          #
          # No pipe é uma corrida: o `<title` está no byte 1903 e o grep -q sai
          # assim que o acha, mas o index.html tem ~114KB e o buffer do pipe
          # segura 64KB — o curl enche, tenta escrever o resto e leva cano
          # fechado, imprimindo "curl: (23) Failure writing output". Medido: 2
          # em 30 execuções. Não quebrava (o status do pipeline é o do grep),
          # mas ruído vermelho num passo que passou treina a ignorar o log — e
          # viraria flake de verdade no dia em que alguém puser `pipefail`.
          # Assim também fica melhor de diagnosticar: falha do curl aparece
          # como falha do curl, não disfarçada de "grep não achou".
          curl -fsS localhost:8099/ -o /tmp/boot-index.html
          grep -qi '<title' /tmp/boot-index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8099/api/perfil -H 'Content-Type: application/json' -d '{}')" = "401"
          kill $SRV
      - name: A data do serial bate com a do commit que bumpou
        if: github.event_name == 'pull_request'
        run: |
          # O serial é YYYYMMDDnn e a promessa dele é "diz DE QUANDO é a versão".
          # Já foi quebrada uma vez: a revisão foi incrementada num dia novo sem
          # trocar a data (2026072403 publicado em 25/07), e o rodapé passou a
          # mentir. Aqui comparamos com a data do COMMIT HEAD do PR — não com
          # "hoje". Isso é de propósito: usar "hoje" falharia sozinho num PR
          # aberto num dia e mergeado no outro, e CI que falha sem culpa treina
          # todo mundo a ignorar CI.
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if ! git diff --quiet "$base" "$head" -- js/version.js; then
            serial=$(git show "$head":js/version.js | grep -oE "APP_VERSION *= *'[0-9]{10}'" | grep -oE "[0-9]{10}")
            data_serial="${serial:0:8}"
            data_commit=$(TZ=UTC git show -s --date=format-local:'%Y%m%d' --format=%cd "$head")
            echo "serial=$serial (data $data_serial) | commit HEAD do PR=$data_commit (UTC)"
            if [ "$data_serial" != "$data_commit" ]; then
              echo "::error::O serial diz $data_serial mas o commit é de $data_commit. Em dia novo, ZERE a revisão: use ${data_commit}01 (rode 'date -u +%Y%m%d'). Se o PR ficou aberto de um dia pro outro, re-bumpe."
              exit 1
            fi
          fi

      - name: Guard do bump de CACHE_NAME (gotcha #17)
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(index\.html|js/|css/|icons/|fonts/)'; then
            if ! git diff "$base" HEAD -- service-worker.js | grep -q 'CACHE_NAME'; then
              echo "::error::Frontend mudou (index.html/js/css/icons) mas CACHE_NAME não foi bumpado no service-worker.js"; exit 1
            fi
          fi
